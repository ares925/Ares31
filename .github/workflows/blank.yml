name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generar proyecto
        run: |
          rm -rf app settings.gradle.kts build.gradle.kts gradle.properties
          mkdir -p app/src/main/java/com/example/gameboost
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GameBoost"
          include(":app")
          EOF
          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "2.0.20" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.20" apply false
          }
          EOF
          cat > gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF
          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.example.gameboost"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.gameboost"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.09.00"))
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.activity:activity-compose:1.9.2")
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF
          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES" />
              <uses-permission android:name="android.permission.ACCESS_NOTIFICATION_POLICY" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <application
                  android:allowBackup="true"
                  android:label="GameBoost"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".GameBoostService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="game_overlay" />
                  </service>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/gameboost/MainActivity.kt << 'EOF'
          package com.example.gameboost

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp
          import androidx.core.content.ContextCompat

          data class AppItem(val label: String, val pkg: String)

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          Surface(Modifier.fillMaxSize()) { GameBoostScreen() }
                      }
                  }
              }
          }

          fun loadApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val intent = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(intent, 0)
                  .map { AppItem(it.loadLabel(pm).toString(), it.activityInfo.packageName) }
                  .filter { it.pkg != ctx.packageName }
                  .distinctBy { it.pkg }
                  .sortedBy { it.label.lowercase() }
          }

          fun launchGame(ctx: Context, pkg: String) {
              if (!Settings.canDrawOverlays(ctx)) {
                  Toast.makeText(ctx, "Primero da el permiso de overlay", Toast.LENGTH_LONG).show()
                  return
              }
              ContextCompat.startForegroundService(
                  ctx, Intent(ctx, GameBoostService::class.java).putExtra("pkg", pkg)
              )
              ctx.packageManager.getLaunchIntentForPackage(pkg)?.let { ctx.startActivity(it) }
          }

          @Composable
          fun GameBoostScreen() {
              val ctx = LocalContext.current
              val apps = remember { loadApps(ctx) }
              val prefs = remember { ctx.getSharedPreferences("games", Context.MODE_PRIVATE) }
              var games by remember { mutableStateOf(prefs.getStringSet("set", emptySet())!!.toSet()) }

              val notifLauncher = rememberLauncherForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) {}
              LaunchedEffect(Unit) {
                  if (Build.VERSION.SDK_INT >= 33) notifLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
              }

              Column(Modifier.fillMaxSize().systemBarsPadding().padding(16.dp)) {
                  Text("GameBoost", style = MaterialTheme.typography.headlineMedium)
                  Spacer(Modifier.height(8.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedButton(onClick = {
                          ctx.startActivity(
                              Intent(
                                  Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                                  Uri.parse("package:${ctx.packageName}")
                              )
                          )
                      }) { Text("Overlay") }
                      OutlinedButton(onClick = {
                          ctx.startActivity(Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS))
                      }) { Text("No molestar") }
                  }
                  Spacer(Modifier.height(8.dp))
                  Text("Marca ★ tus juegos y pulsa Jugar.", style = MaterialTheme.typography.bodySmall)
                  Spacer(Modifier.height(8.dp))

                  LazyColumn {
                      items(apps.sortedByDescending { it.pkg in games }, key = { it.pkg }) { app ->
                          val isGame = app.pkg in games
                          Row(
                              Modifier.fillMaxWidth().padding(vertical = 2.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(app.label, Modifier.weight(1f))
                              TextButton(onClick = {
                                  games = if (isGame) games - app.pkg else games + app.pkg
                                  prefs.edit().putStringSet("set", games).apply()
                              }) { Text(if (isGame) "★" else "☆") }
                              if (isGame) Button(onClick = { launchGame(ctx, app.pkg) }) { Text("Jugar") }
                          }
                      }
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/gameboost/GameBoostService.kt << 'EOF'
          package com.example.gameboost

          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.ApplicationInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.os.BatteryManager
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.os.PowerManager
          import android.view.Gravity
          import android.view.WindowManager
          import android.widget.TextView
          import androidx.core.app.ServiceCompat

          class GameBoostService : Service() {

              private lateinit var wm: WindowManager
              private lateinit var am: ActivityManager
              private lateinit var nm: NotificationManager
              private var overlay: TextView? = null
              private var expanded = false
              private var previousFilter = NotificationManager.INTERRUPTION_FILTER_ALL
              private var dndChanged = false
              private val handler = Handler(Looper.getMainLooper())

              private val ticker = object : Runnable {
                  override fun run() {
                      overlay?.text = stats()
                      handler.postDelayed(this, 1000)
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(WindowManager::class.java)
                  am = getSystemService(ActivityManager::class.java)
                  nm = getSystemService(NotificationManager::class.java)
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startAsForeground()
                  val gamePkg = intent?.getStringExtra("pkg")
                  boost(gamePkg)
                  enableDnd()
                  if (overlay == null) showOverlay()
                  handler.removeCallbacks(ticker)
                  handler.post(ticker)
                  return START_NOT_STICKY
              }

              private fun startAsForeground() {
                  val channelId = "gameboost"
                  nm.createNotificationChannel(
                      NotificationChannel(channelId, "GameBoost", NotificationManager.IMPORTANCE_LOW)
                  )
                  val notif = Notification.Builder(this, channelId)
                      .setContentTitle("GameBoost activo")
                      .setContentText("Modo juego en marcha")
                      .setSmallIcon(android.R.drawable.ic_media_play)
                      .build()
                  ServiceCompat.startForeground(
                      this, 1, notif,
                      if (Build.VERSION.SDK_INT >= 34)
                          android.content.pm.ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE else 0
                  )
              }

              /** Cierra procesos en segundo plano de apps de usuario (el sistema decide cuáles). */
              private fun boost(gamePkg: String?) {
                  packageManager.getInstalledApplications(0)
                      .filter { (it.flags and ApplicationInfo.FLAG_SYSTEM) == 0 }
                      .filter { it.packageName != packageName && it.packageName != gamePkg }
                      .forEach { am.killBackgroundProcesses(it.packageName) }
              }

              private fun enableDnd() {
                  if (nm.isNotificationPolicyAccessGranted && !dndChanged) {
                      previousFilter = nm.currentInterruptionFilter
                      nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_PRIORITY)
                      dndChanged = true
                  }
              }

              private fun showOverlay() {
                  val tv = TextView(this).apply {
                      setTextColor(Color.WHITE)
                      textSize = 12f
                      setPadding(24, 12, 24, 12)
                      setBackgroundColor(0x99000000.toInt())
                      setOnClickListener { expanded = !expanded; text = stats() }
                      setOnLongClickListener { stopSelf(); true }
                  }
                  val lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  ).apply { gravity = Gravity.TOP or Gravity.START; x = 24; y = 48 }
                  wm.addView(tv, lp)
                  overlay = tv
              }

              private fun stats(): String {
                  val mi = ActivityManager.MemoryInfo().also { am.getMemoryInfo(it) }
                  val usedPct = 100 - (mi.availMem * 100 / mi.totalMem)
                  val b = registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
                  val temp = (b?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, 0) ?: 0) / 10f
                  val level = b?.getIntExtra(BatteryManager.EXTRA_LEVEL, 0) ?: 0
                  return if (expanded)
                      "RAM: $usedPct%\nBatería: $level% · $temp°C\nTérmico: ${thermal()}\n(toca: reducir · mantén: salir)"
                  else "RAM $usedPct% · $temp°C"
              }

              private fun thermal(): String {
                  if (Build.VERSION.SDK_INT < 29) return "n/d"
                  val pm = getSystemService(PowerManager::class.java)
                  return when (pm.currentThermalStatus) {
                      PowerManager.THERMAL_STATUS_NONE, PowerManager.THERMAL_STATUS_LIGHT -> "OK"
                      PowerManager.THERMAL_STATUS_MODERATE -> "Caliente"
                      else -> "¡Crítico!"
                  }
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  overlay?.let { runCatching { wm.removeView(it) } }
                  overlay = null
                  if (dndChanged && nm.isNotificationPolicyAccessGranted) {
                      nm.setInterruptionFilter(previousFilter)
                  }
                  super.onDestroy()
              }
          }
          EOF
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compilar APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GameBoost-APK
          path: app/build/outputs/apk/debug/app-debug.apk
